<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Developer Console | Mr. Ahmed Attia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:"DM Sans",sans-serif;color:#e8edf7;background:#0b1020;--panel:#121a2c;--panel2:#172238;--line:#26334c;--muted:#94a3b8;--purple:#9b8cff;--green:#42d6a4;--red:#ff7e88;--amber:#f5bd67}
*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(ellipse at 80% 0%,#2b2856 0,transparent 35%),#0b1020}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);padding:34px;border:1px solid var(--line);border-radius:22px;background:#121a2cf2;box-shadow:0 28px 90px #0006}.brand{font:800 12px Manrope;letter-spacing:.12em;color:#fff}.brand span{color:var(--purple)}.login h1{font:800 30px Manrope;margin:34px 0 8px}.muted{color:var(--muted);line-height:1.65}.field{display:grid;gap:7px;margin:16px 0}.field label{font-size:12px;color:#c4cde0;font-weight:700}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid var(--line);background:#0c1425;color:#fff;border-radius:10px;padding:12px;outline:none}.btn{border:1px solid var(--line);background:#1b2942;color:#eaf0ff;border-radius:10px;padding:10px 14px;font-weight:750;font-size:12px}.btn.primary{background:linear-gradient(135deg,#8f7cff,#6e62d7);border-color:transparent;color:white}.btn.danger{background:#3a202e;border-color:#653242;color:#ffb3ba}.btn:disabled{opacity:.5;cursor:wait}.login .btn{width:100%;margin-top:10px}.error{color:#ff9ca5;font-size:12px;margin-top:12px}.success{color:var(--green);font-size:12px;margin-top:12px}
.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:24px 16px;background:#0e1627;border-right:1px solid var(--line);display:flex;flex-direction:column}.side-brand{padding:4px 12px 25px;border-bottom:1px solid var(--line)}.side-brand strong{font:800 13px Manrope;letter-spacing:.1em}.side-brand small{display:block;color:var(--muted);font-size:10px;margin-top:7px}.nav{display:grid;gap:5px;padding-top:20px;overflow:auto}.nav button{text-align:left;border:0;background:transparent;color:#a8b4ca;padding:11px 12px;border-radius:10px;font-size:12px;font-weight:700}.nav button.active,.nav button:hover{background:#24264a;color:#fff}.nav button span{display:inline-block;width:24px;color:var(--purple)}.side-bottom{margin-top:auto;padding-top:15px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between}.side-bottom small{color:var(--muted);font-size:10px;overflow-wrap:anywhere}
main{padding:30px clamp(18px,3vw,44px);min-width:0;max-width:1600px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:27px}.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--purple);font-weight:800}.topbar h1{font:800 clamp(24px,3vw,34px) Manrope;margin:7px 0 0}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.stat,.panel{border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#151f34,#10192a);padding:17px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font:800 26px Manrope;margin-top:9px}.stat em{font-style:normal;color:var(--green);font-size:10px}.panel{margin-top:15px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panel h2{font:750 16px Manrope;margin:0}.panel p{font-size:12px;color:var(--muted);line-height:1.6}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.toolbar input{max-width:300px}.toolbar select{max-width:220px}.feature-list{display:grid;gap:8px}.feature{display:grid;grid-template-columns:minmax(190px,1fr) auto auto;align-items:center;gap:13px;border:1px solid #26334b;border-radius:12px;padding:12px;background:#10192a}.feature strong{font-size:12px;display:block}.feature small{font-size:10px;color:var(--muted)}.feature-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.feature select{background:#0b1424;color:#dce6fa;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:10px}.switch{display:flex;align-items:center;gap:7px;color:#b8c4d8;font-size:10px}.switch input{accent-color:#8f7cff;width:16px;height:16px}.role-row{display:flex;gap:8px;flex-wrap:wrap}.role-row label{font-size:9px;color:#aebbd0;display:flex;align-items:center;gap:4px}.role-row input{accent-color:#8f7cff}.section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.control{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:13px 0}.control:last-child{border:0}.control strong{font-size:12px}.control small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.status{display:inline-flex;padding:5px 8px;border-radius:99px;background:#24344a;color:#b8c9df;font-size:9px;font-weight:800}.status.ready{background:#123c36;color:#77e3bc}.status.warn{background:#45351f;color:#ffd28b}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:#9baac2;font-size:10px}.empty{padding:20px;text-align:center;color:var(--muted);font-size:12px}.notice{padding:12px 14px;background:#2d271d;border:1px solid #54432a;color:#f3d49c;border-radius:11px;font-size:11px;line-height:1.65;margin:10px 0}.mobile-head{display:none}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app{grid-template-columns:220px 1fr}}
@media(max-width:720px){.app{display:block}.sidebar{position:relative;height:auto;padding:13px;border-right:0;border-bottom:1px solid var(--line)}.side-brand{padding:7px 8px 12px}.nav{display:flex;overflow:auto;padding-top:10px}.nav button{white-space:nowrap;padding:9px}.side-bottom{display:none}main{padding:20px 13px}.topbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.section-grid{grid-template-columns:1fr}.feature{grid-template-columns:1fr}.feature-controls{justify-content:flex-start}.toolbar input,.toolbar select{max-width:none;flex:1}.panel{padding:13px}.table-wrap{overflow:auto}}
</style></head>
<body>
<div id="loginView" class="login-wrap"><form id="loginForm" class="login"><div class="brand">MR. AHMED ATTIA <span>/ DEV</span></div><h1>Developer Console</h1><p class="muted">Sign in with your authorized Developer account. Access is verified by Firebase custom claims and the server.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" id="loginBtn">Sign in securely</button><div id="loginMessage" aria-live="polite"></div></form></div>

</div>

</body></html>
