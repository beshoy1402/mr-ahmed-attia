name: Frontend build
on:
  push:
    branches: [react-portfolio-redesign]
  pull_request:
    branches: [production-foundation]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
