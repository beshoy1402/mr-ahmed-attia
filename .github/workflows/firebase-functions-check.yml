name: Firebase Functions source check

on:
  push:
    branches: [production-foundation, react-portfolio-redesign]
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.indexes.json"
      - "api/**"
      - "portal.js"
      - "dashboard-redesign.css"
      - ".github/workflows/**"
  pull_request:
    branches: [production-foundation]
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.indexes.json"
      - "api/**"
      - "portal.js"
      - ".github/workflows/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Functions dependencies
        run: npm install --prefix functions
      - name: Check JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/developer.js
          node --check functions/core.cjs
          node --check functions/teacher-core.cjs
          node --check functions/developer-core.cjs
          node --check api/callable.js
          node --check portal.js
          node --check functions/scripts/bootstrap-main-teacher.mjs
          node --check functions/scripts/provision-test-accounts.mjs
      - name: Validate Firebase JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json', 'utf8'))"
